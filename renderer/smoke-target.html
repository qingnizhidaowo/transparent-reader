<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>跳转成功</title>
  <style>
    /* 模拟真实网站（考试/答题类）的两种“顽固白底”：
       1) 用 !important 写死的 html/body 白底 —— author 级注入会被压过，用户级注入才能剥掉
       2) iframe 子框架内的白底 —— 需要逐 frame 补注入 */
    html, body { background: #ffffff !important; }
    #card {
      background: #ffffff !important; /* 顽固白底容器 */
      border: 1px solid #9aa3b5;
      padding: 10px 12px;
      margin: 14px 0;
    }
    #sub {
      display: block;
      width: 100%;
      height: 84px;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>
<body style="background:#1b1e24;color:#ccd3dd;font-family:'Segoe UI','Microsoft YaHei',sans-serif;padding:40px;line-height:1.8">
  <h2 style="color:#eef2f8">新标签链接已在应用内打开</h2>
  <p>如果你能看到这个页面，说明 target="_blank" 的链接已经能在本窗口内自动跳转了。</p>
  <p>点工具栏的「后退」按钮可以回到上一页。此页面为测试页。</p>
  <div id="card">卡片：用 !important 写死的白色背景，背景透明模式下也应完全透掉（文字保留原色）。</div>
  <iframe id="sub" srcdoc="&lt;body style=&quot;background:#ffffff;color:#334455;margin:0;padding:8px;font-family:sans-serif&quot;&gt;iframe 子框架：这里的白底也应被剥透&lt;/body&gt;"></iframe>
</body>
</html>
